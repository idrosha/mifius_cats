# Amvera — Mythfel web-hud (Docker).
# Runtime must NOT run `npm start` → node client/web-hud/server.mjs (that path is absent in /app).
# Force the container entry to the flat /app/server.mjs produced by Dockerfile.
# Docs: https://docs.amvera.ru/applications/configuration/docker.html
meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  # ENTRYPOINT-style: ignore any npm start from package.json.
  command: node
  args: server.mjs
  containerPort: 5000
