# Amvera — Mythfel web-hud via Docker (monorepo-safe).
# Node npm artifacts + custom globs kept missing /app/server.mjs → process exit → 503.
# Docker COPY builds the exact /app tree the process needs.
# Docs: https://docs.amvera.ru/applications/configuration/docker.html
meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  # Amvera sets PORT to this value; server.mjs listens on process.env.PORT.
  containerPort: 5000
