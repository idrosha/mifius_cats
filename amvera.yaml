# Amvera — Mythfel web-hud (Node/npm).
# Docs: https://docs.amvera.ru/applications/environments/nodejs-server.html
# PORT is provided by Amvera as run.containerPort (also set PORT=5000 in cabinet
# Variables if needed; DELETE any HUD_PORT=8088 leftover).
meta:
  environment: node
  toolchain:
    name: npm
    version: 20

build:
  artifacts:
    # Real web-hud server → /app/server.mjs (not monorepo root shim)
    "client/web-hud/server.mjs": /
    "client/web-hud/public": /
    "content/i18n": /content
    "liveops/config": /liveops
    "package.json": /

run:
  scriptName: server.mjs
  containerPort: 5000
