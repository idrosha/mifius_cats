# Amvera — Mythfel web-hud only (no quiz / Unity / battle process).
# Docs: https://docs.amvera.ru/applications/environments/nodejs-server.html
# Must listen on 0.0.0.0 + process.env.PORT (see client/web-hud/server.mjs).
meta:
  environment: node
  toolchain:
    name: npm
    version: 20

build:
  # Flatten web-hud into /app so scriptName=server.mjs always exists.
  # Nested "client/web-hud" paths were missing after artifacts → process exit → 503.
  artifacts:
    "client/web-hud/*": /
    "content/i18n": /content
    "liveops/config": /liveops

run:
  scriptName: server.mjs
  # Use 8080 (not 80): unprivileged listen. Amvera sets PORT=containerPort.
  # Binding :80 often fails with EACCES → crash → public 503.
  containerPort: 8080
