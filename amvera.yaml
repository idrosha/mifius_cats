# Amvera — Mythfel web-hud only (no quiz, no Unity, no battle process).
# Docs: https://docs.amvera.ru/applications/environments/nodejs-server.html
# App must listen on 0.0.0.0 and process.env.PORT (see client/web-hud/server.mjs).
meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  # Root + web-hud have no runtime npm dependencies.
  skip: yes

run:
  scriptName: client/web-hud/server.mjs
  # Amvera sets PORT to this value (default 80 if omitted).
  containerPort: 80
