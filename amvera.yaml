# Amvera — Mythfel web-hud (Node/npm).
# Runtime logs showed `npm start` / node — NOT Docker CMD. Use Node Server schema.
# Docs: https://docs.amvera.ru/applications/environments/nodejs-server.html
# Flat /app: copy real web-hud server.mjs (not the monorepo shim) so start never
# needs client/web-hud/server.mjs inside the container.
meta:
  environment: node
  toolchain:
    name: npm
    version: 20

build:
  artifacts:
    # file → /app/server.mjs (basename only)
    "client/web-hud/server.mjs": /
    # folder → /app/public
    "client/web-hud/public": /
    "content/i18n": /content
    "liveops/config": /liveops
    # start script: "node server.mjs" (see package.json)
    "package.json": /

run:
  # Amvera runs: node server.mjs  (not npm start of nested path)
  scriptName: server.mjs
  # Must match server listen (process.env.PORT or default 5000 in server.mjs).
  # Edge :80 → this containerPort. Mismatch (e.g. app on 8088) → SIGTERM / 503.
  containerPort: 5000
