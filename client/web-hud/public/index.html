<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="shell-type" content="web_standard" />
  <meta name="hud-ui" content="awaiting-new-stitch" />
  <title>Мифиус — Web HUD (shell)</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="mythfel-shell">
  <header id="appNav" class="mythfel-nav" aria-label="Mythfel navigation">
    <div class="mythfel-nav-top">
      <button type="button" class="mythfel-brand" id="btnBrandHub" title="Хаб">
        <span class="mythfel-brand-mark" aria-hidden="true">🐾</span>
        <span class="mythfel-brand-text">
          <strong>МИФИУС</strong>
          <span id="brandSub">Ур. 1 · Soft Launch</span>
        </span>
      </button>
      <nav id="appTabs" class="mythfel-primary" aria-label="Основные разделы"></nav>
      <div id="hudChrome" class="mythfel-chrome" aria-label="status">
        <div id="liveopsPill" class="status-pill">LiveOps…</div>
        <div id="battlePill" class="status-pill">Battle…</div>
        <div class="locale-switch" id="localeSwitch"></div>
      </div>
    </div>
    <nav id="appSubTabs" class="mythfel-subtabs" aria-label="Подразделы"></nav>
  </header>

  <div id="toast" class="hidden" role="status"></div>

  <main id="app">
    <section id="viewBoot" class="hud-view panel-boot">
      <div class="boot-card">
        <p class="eyebrow">Boot</p>
        <h2>Мифиус</h2>
        <p class="lead" id="bootMsg">Загрузка LiveOps…</p>
        <p class="lead muted">UI awaits new Stitch import. Battle core + wire dock remain.</p>
      </div>
    </section>
    <section id="viewHub" class="hud-view hidden" data-view="hub"></section>
    <section id="viewLogin" class="hud-view hidden" data-view="login"></section>
    <section id="viewPractice" class="hud-view hidden" data-view="practice"></section>
    <section id="viewCodex" class="hud-view hidden" data-view="codex"></section>
    <section id="viewYard" class="hud-view hidden" data-view="yard"></section>
    <section id="viewFormation" class="hud-view hidden" data-view="formation"></section>
    <section id="viewBossRaid" class="hud-view hidden" data-view="boss_raid"></section>
    <section id="viewBattle" class="hud-view hidden" data-view="battle"></section>
    <section id="viewResultWin" class="hud-view hidden" data-view="result_win"></section>
    <section id="viewResultLose" class="hud-view hidden" data-view="result_lose"></section>
    <section id="viewCollection" class="hud-view hidden" data-view="collection"></section>
    <section id="viewShop" class="hud-view hidden" data-view="shop"></section>
    <section id="viewMarket" class="hud-view hidden" data-view="market"></section>
    <section id="viewTavern" class="hud-view hidden" data-view="tavern"></section>
    <section id="viewPass" class="hud-view hidden" data-view="pass"></section>
    <section id="viewPvp" class="hud-view hidden" data-view="pvp"></section>
    <section id="viewSoonFarm" class="hud-view hidden" data-view="soon_farm"></section>
    <section id="viewSoonClan" class="hud-view hidden" data-view="soon_clan"></section>
    <section id="viewGear" class="hud-view hidden" data-view="gear"></section>
    <section id="viewHome" class="hud-view hidden" data-view="home"></section>
    <section id="viewHeroes" class="hud-view hidden" data-view="heroes"></section>
    <section id="viewArmorSets" class="hud-view hidden" data-view="armor_sets"></section>
    <section id="viewClassSets" class="hud-view hidden" data-view="class_sets"></section>
    <section id="viewEquipCards" class="hud-view hidden" data-view="equip_cards"></section>
    <section id="viewCraft" class="hud-view hidden" data-view="craft"></section>
    <section id="viewBreeding" class="hud-view hidden" data-view="breeding"></section>
    <section id="viewAuction" class="hud-view hidden" data-view="auction"></section>
    <section id="viewGuild" class="hud-view hidden" data-view="guild"></section>
    <section id="viewChatGlobal" class="hud-view hidden" data-view="chat_global"></section>
    <section id="viewChatGuild" class="hud-view hidden" data-view="chat_guild"></section>
    <section id="viewChatFriends" class="hud-view hidden" data-view="chat_friends"></section>
    <section id="viewRatingPlayers" class="hud-view hidden" data-view="rating_players"></section>
    <section id="viewRatingGuilds" class="hud-view hidden" data-view="rating_guilds"></section>
    <section id="viewBossDungeon" class="hud-view hidden" data-view="boss_dungeon"></section>
    <section id="viewResult" class="hud-view hidden" data-alias="result"></section>
    <section id="viewSoon" class="hud-view hidden" data-alias="soon">
      <div class="boot-card">
        <p class="eyebrow">Скоро</p>
        <h2 id="soonTitle">Скоро</h2>
        <p id="soonBody">Скоро</p>
        <div class="soon-links" id="soonLinks"></div>
      </div>
    </section>
  </main>

  <aside id="wireDock" class="mythfel-wire" aria-label="HUD wire controls">
    <div class="mythfel-wire-inner">
      <span class="mythfel-wire-label">HUD</span>
      <button type="button" class="wire-btn" data-for="login" id="btnLoginEnter">Войти → Хаб</button>
      <button type="button" class="wire-btn" data-for="practice" id="btnPracticeBattle">Тренировочный бой</button>
      <button type="button" class="wire-btn" data-for="practice" id="btnPracticeHub">В Хаб</button>
      <button type="button" class="wire-btn" data-for="codex" id="btnCodexHub">В Хаб</button>
      <button type="button" class="wire-btn" data-for="yard" id="btnYardMissionRefresh">Обновить миссии</button>
      <button type="button" class="wire-btn" data-for="boss_dungeon" id="btnBossFirstWave">Первый босс · волна</button>
      <button type="button" class="wire-btn" data-for="yard" id="btnTutorial">Туториал → бой</button>
      <button type="button" class="wire-btn" data-for="yard" id="btnYardToFormation">Расстановка</button>
      <button type="button" class="wire-btn" data-for="yard" id="btnYardBattle">Бой в Мифмире</button>
      <button type="button" class="wire-btn" data-for="yard" id="btnYardAuto">Автопобеда</button>
      <button type="button" class="wire-btn" data-for="formation" id="btnFormationBattle">В бой</button>
      <button type="button" class="wire-btn" data-for="formation" id="btnFormationYard">В Мифмир</button>
      <button type="button" class="wire-btn" data-for="formation" id="btnFormationTavern">В Таверну</button>
      <button type="button" class="wire-btn" data-for="boss_dungeon" id="btnBossDungeonRaid">В рейд / легион</button>
      <button type="button" class="wire-btn" data-for="boss_dungeon" id="btnBossDungeonHub">В Хаб</button>
      <button type="button" class="wire-btn" data-for="boss_raid" id="btnBossRaidHub">В Хаб</button>
      <button type="button" class="wire-btn" data-for="boss_raid" id="btnBossRaidFormation">Строй 3v3</button>
      <button type="button" class="wire-btn" data-for="boss_raid" id="btnBossRaidDungeon">К выбору данжа</button>
      <button type="button" class="wire-btn" data-for="battle" id="btnEndTurn">Конец хода</button>
      <button type="button" class="wire-btn" data-for="battle" id="btnKeep">Keep</button>
      <button type="button" class="wire-btn" data-for="battle" id="btnSurrender">Сдаться</button>
      <button type="button" class="wire-btn" data-for="battle" id="btnBackHub">В хаб</button>
      <button type="button" class="wire-btn" data-for="result" id="btnResultHub">В Хаб</button>
      <button type="button" class="wire-btn" data-for="result" id="btnResultYard">В Мифмир</button>
      <button type="button" class="wire-btn" data-for="result" id="btnResultRetry">Повторить</button>
      <button type="button" class="wire-btn" data-for="result" id="btnResultFormation">Расстановка</button>
      <button type="button" class="wire-btn" data-for="collection" id="btnColFormation">Расстановка</button>
      <button type="button" class="wire-btn" data-for="collection" id="btnColForge">Оружейная → Скоро</button>
      <button type="button" class="wire-btn" data-for="shop" id="btnShopToTavern">В Таверну</button>
      <button type="button" class="wire-btn" data-for="shop" id="btnGacha1">Гача ×1</button>
      <button type="button" class="wire-btn" data-for="shop" id="btnGacha10">Гача ×10</button>
      <button type="button" class="wire-btn" data-for="market" id="btnSellStarter">Quick sell (gated)</button>
      <button type="button" class="wire-btn" data-for="market" id="btnMarketQuickSell">Quick sell</button>
      <button type="button" class="wire-btn" data-for="market" id="btnMarketToShop">В Лавку</button>
      <button type="button" class="wire-btn" data-for="market" id="btnMarketToAuction">В Аукцион</button>
      <button type="button" class="wire-btn" data-for="auction" id="btnAuctionList">Выставить лот (gated)</button>
      <button type="button" class="wire-btn" data-for="auction" id="btnAuctionToMarket">В Рынок</button>
      <button type="button" class="wire-btn" data-for="tavern" id="btnTavernFormation">К расстановке</button>
      <button type="button" class="wire-btn" data-for="tavern" id="btnTavernHub">В Хаб</button>
      <button type="button" class="wire-btn" data-for="pass" id="btnPassShop">В Лавку</button>
      <button type="button" class="wire-btn" data-for="pass" id="btnPassHub">В Хаб</button>
      <button type="button" class="wire-btn" data-for="guild" id="btnGuildBattle">Бой гильдий</button>
      <button type="button" class="wire-btn" data-for="guild" id="btnGuildHub">В Хаб</button>
      <button type="button" class="wire-btn" data-for="pvp" id="btnPvpAuto">Автобой PvP</button>
      <button type="button" class="wire-btn" data-for="pvp" id="btnPvpFormation">Расстановка</button>
      <button type="button" class="wire-btn" data-for="pvp" id="btnRefreshReplays">Реплеи</button>
      <button type="button" class="wire-btn" data-for="soon" id="btnSoonHub">В Хаб</button>
      <div id="shopSubtabs" class="hidden"></div>
      <div id="marketSubtabs" class="hidden"></div>
      <div id="gachaPanel" class="hidden"><h3 id="gachaTitle"></h3><p id="gachaLead"></p></div>
      <div id="marketSell" class="hidden"><p id="sellLead"></p></div>
      <div id="tutorialBanner" class="banner warn hidden"></div>
      <div id="resultBanner" class="banner hidden"></div>
      <p class="eyebrow hidden" id="resultEyebrow"></p>
      <h2 class="hidden" id="resultTitle"></h2>
      <p class="hidden" id="resultLead"></p>
      <p class="eyebrow hidden" id="hubEyebrow"></p>
      <h2 class="hidden" id="hubTitle"></h2>
      <p class="hidden" id="hubLead"></p>
      <div class="hidden" id="hubPortals"></div>
      <p class="hidden" id="yardEyebrow"></p>
      <h2 class="hidden" id="yardTitle"></h2>
      <p class="hidden" id="yardLead"></p>
      <p class="eyebrow hidden" id="formEyebrow"></p>
      <h2 class="hidden" id="formTitle"></h2>
      <p class="hidden" id="formLead"></p>
      <p class="eyebrow hidden" id="colEyebrow"></p>
      <h2 class="hidden" id="colTitle"></h2>
      <p class="hidden" id="colLead"></p>
      <p class="eyebrow hidden" id="shopEyebrow"></p>
      <h2 class="hidden" id="shopTitle"></h2>
      <p class="hidden" id="shopLead"></p>
      <p class="eyebrow hidden" id="marketEyebrow"></p>
      <h2 class="hidden" id="marketTitle"></h2>
      <p class="hidden" id="marketLead"></p>
      <p class="eyebrow hidden" id="auctionEyebrow"></p>
      <h2 class="hidden" id="auctionTitle"></h2>
      <p class="hidden" id="auctionLead"></p>
      <ul class="hidden offer-list" id="auctionList"></ul>
      <p class="eyebrow hidden" id="tavernEyebrow"></p>
      <h2 class="hidden" id="tavernTitle"></h2>
      <p class="hidden" id="tavernLead"></p>
      <span class="hidden" id="drinksLabel"></span>
      <span class="hidden" id="potionsLabel"></span>
      <div class="hidden" id="drinkList"></div>
      <div class="hidden" id="potionList"></div>
      <p class="eyebrow hidden" id="passEyebrow"></p>
      <h2 class="hidden" id="passTitle"></h2>
      <p class="hidden" id="passLead"></p>
      <p class="eyebrow hidden" id="pvpEyebrow"></p>
      <h2 class="hidden" id="pvpTitle"></h2>
      <p class="hidden" id="pvpLead"></p>
      <h2 class="hidden" id="battleHeading"></h2>
      <span class="hidden" id="curGold"></span>
      <span class="hidden" id="curMilk"></span>
      <span class="hidden" id="curEnergy"></span>
      <span class="hidden" id="curGems"></span>
      <div class="wire-panel" data-for="yard"><div class="card-grid" id="starterCards"></div></div>
      <div class="hidden" id="gateTipBanner"></div>
      <div class="wire-panel" data-for="formation">
        <div class="formation-lanes" id="formationLanes"></div>
        <div class="potion-tray" id="formationPotions"></div>
      </div>
      <div class="wire-panel" data-for="battle">
        <div class="mythfel-battle-stats" id="battleStats"></div>
        <div class="mythfel-board">
          <div><div class="meta">Враги</div><div class="lane-row" id="enemyBoard"></div></div>
          <div><div class="meta">Союзники</div><div class="lane-row" id="allyBoard"></div></div>
        </div>
        <div class="mythfel-hand" id="hand"></div>
        <pre class="mythfel-log" id="battleLog"></pre>
      </div>
      <div class="wire-panel" data-for="collection"><div class="card-grid" id="collectionCards"></div></div>
      <div class="wire-panel" data-for="shop"><ul class="offer-list" id="offerList"></ul></div>
      <div class="wire-panel" data-for="market"><ul class="offer-list" id="marketList"></ul></div>
      <div class="wire-panel" data-for="pass"><ul class="offer-list" id="passList"></ul></div>
      <div class="wire-panel" data-for="pvp">
        <ul class="replay-list" id="replayList"></ul>
        <pre class="mythfel-log" id="pvpLog"></pre>
      </div>
    </div>
  </aside>

  <nav id="hubTabs" class="hidden" aria-hidden="true"></nav>
  <script type="module" src="/app.js"></script>
</body>
</html>
