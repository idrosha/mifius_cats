<!-- Live character desk. Address: /hero. Soft exits closed; shared fillNav only. -->
<section id="viewHome" class="stitch-view mythfel-form hidden" data-stitch="home" data-layout="landscape" data-purpose-route="hero">
<main class="char-sheet" data-purpose="character-home">
<div class="char-body">
<section class="char-col char-col-stats" id="homeStatBlock">Дом Хранителя</section>
<section class="char-stage">
<div class="char-fit" id="homeHeroCard"></div>
<div class="char-selected" id="homeSelectedItem"></div>
<div class="char-squad">
<ul id="homeCatPicker"></ul>
<button type="button" class="char-ghost" id="homeSquadBtn" tabindex="-1">Сменить отряд</button>
</div>
</section>
<aside class="char-col char-col-bag">
<div class="char-bag-head"><b>Инвентарь</b><span id="homeBagCount"></span></div>
<div class="char-filters" id="homeBagTabs">
<button type="button" data-bag="all">Все</button>
<button type="button" data-bag="weapon">Оружие</button>
<button type="button" data-bag="helm">Шлемы</button>
<button type="button" data-bag="armor">Броня</button>
<button type="button" data-bag="amulet">Амулеты</button>
</div>
<div class="char-rarity" id="homeRarityTabs">
<button type="button" data-rarity="all">Все</button>
<button type="button" data-rarity="mythic">Миф</button>
<button type="button" data-rarity="epic">Эпик</button>
<button type="button" data-rarity="rare">Редк</button>
</div>
<ul class="char-cells" id="homeGearBlock"></ul>
<div class="char-compare" id="homeCompare"></div>
</aside>
</div>
<footer class="char-deck">
<div class="char-deck-head">
<b id="homeDeckLabel">Боевая Колода Котика — Карты Атак Кота (6 Приёмов)</b>
<span id="homeDeckAp">Расход AP: 11 AP / ход</span>
<button type="button" class="char-gold" id="homeDeckSetup" tabindex="-1">Настроить колоду</button>
</div>
<ul class="char-deck-cards" id="homeDeckCards"></ul>
</footer>
<footer class="char-foot">
<span>© 2025 Мифиус: Мифические котики · Версия 1.4.2</span>
<span class="char-server">Сервер: Лукоморье [Ru-1]</span>
<span class="char-keys">[C] Персонаж · [I] Инвентарь · [M] Карта · [ESC] Меню</span>
</footer>
<!-- hosts kept for verify-nav / legacy wire -->
<div id="homeWallet" hidden></div>
<div id="homeUser" hidden>Хранитель</div>
<div id="homeSetLine" hidden></div>
<div id="homeDeckHint" hidden></div>
</main>
</section>
<!-- Live character desk. Дом Хранителя Инвентарь Экипировка -->
