<section id="viewHome" class="stitch-view mythfel-form hidden" data-stitch="home" data-layout="landscape">
<main class="char-desk" data-purpose="character-home">
<div class="char-desk-grid">
<aside class="char-col" id="homeStatBlock" aria-label="Параметры персонажа"></aside>
<section class="char-stage" aria-label="Очаг">
<div class="char-stage-frame" id="homeHeroCard"></div>
<div class="char-stage-foot">
<p id="homeSetLine">Слоты пусты.</p>
<button type="button" class="char-btn char-btn-ghost" id="homeUnequip">Снять</button>
</div>
</section>
<aside class="char-bag" aria-label="Инвентарь">
<div class="char-bag-head">
<strong>Инвентарь</strong>
<span>Экипировка</span>
</div>
<div class="char-bag-tabs" id="homeBagTabs">
<button type="button" data-bag="all" class="is-on">Всё</button>
<button type="button" data-bag="weapon">Оружие</button>
<button type="button" data-bag="armor">Броня</button>
<button type="button" data-bag="helm">Шлем</button>
<button type="button" data-bag="boots">Обувь</button>
</div>
<div class="char-bag-grid" id="homeGearBlock"></div>
<div class="char-compare" id="homeCompare"></div>
</aside>
</div>
<footer class="char-deck">
<div>
<p class="char-kicker">Дом Хранителя · Персонаж</p>
<p id="homeDeckLabel">Боевая колода</p>
</div>
<div class="char-deck-row" id="homeCatPicker"></div>
</footer>
</main>
</section>
