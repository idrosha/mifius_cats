<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600;700&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config={darkMode:"class"}</script>
</head>
<body class="bg-surface font-body-md text-on-surface">
<section id="viewHome" class="stitch-view mythfel-form hidden" data-stitch="home" data-layout="landscape">
<main class="char-sheet" data-purpose="character-home">
<header class="char-top">
<div class="char-brand"><b>МИФИУС</b><span class="char-live">в сети</span></div>
<ul class="char-wallet" id="homeWallet"></ul>
<div class="char-user" id="homeUser">Хранитель</div>
</header>
<nav class="char-tabs" aria-label="Дом Хранителя">
<a data-path="glavnyy-khab" href="#">Главный Хаб</a>
<a class="is-on" data-path="personazh" href="#">Персонаж / Дом</a>
<a data-path="ekipirovka-sumka" href="#">Инвентарь</a>
<a data-path="ferma" href="#">Угодья / Ферма</a>
<a data-path="kraft" href="#">Крафт</a>
<a data-path="mythworld-pve" href="#">Поход (ПвЕ)</a>
<a data-path="pvp-arena" href="#">Арена (PvP)</a>
</nav>
<nav class="char-sub" aria-label="Рабочий стол">
<a class="is-on" data-path="personazh" href="#">Рабочий стол</a>
<a data-path="ekipirovka-sumka" href="#">Экипировка</a>
<a data-path="ekipirovka-sumka" href="#">Сумка</a>
<a data-path="sety-broni" href="#">Сеты брони</a>
<a data-path="klassovye-sety" href="#">Классовые сеты</a>
<a data-path="kodeks-geroev" href="#">Кодекс героев</a>
</nav>
<div class="char-body">
<section class="char-col" id="homeStatBlock">Дом Хранителя</section>
<section class="char-stage">
<div class="char-fit" id="homeHeroCard"></div>
<div class="char-active" id="homeSetLine"></div>
<div class="char-compare" id="homeCompare"></div>
</section>
<aside class="char-col">
<div class="char-bag-head"><b>Инвентарь</b><span id="homeBagCount"></span></div>
<div class="char-filters" id="homeBagTabs">
<button type="button" data-bag="all">Все</button>
<button type="button" data-bag="weapon">Оружие</button>
<button type="button" data-bag="helm">Шлемы</button>
<button type="button" data-bag="armor">Броня</button>
<button type="button" data-bag="boots">Обувь</button>
</div>
<ul class="char-cells" id="homeGearBlock"></ul>
</aside>
</div>
<footer class="char-deck">
<div class="char-deck-head"><b id="homeDeckLabel">Боевая колода</b><span>Нажми кота, чтобы открыть его стол</span></div>
<ul id="homeCatPicker"></ul>
</footer>
</main>
</section>
