<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<title>Дом Хранителя · Персонаж</title>
<style>
/* Home character desk: Персонаж and Дом Хранителя share this sheet. Shared #appNav stays. */
#viewHome > main.char-desk {
  flex: 1 1 auto !important;
  min-height: 0 !important;
  height: 100% !important;
  display: flex !important;
  flex-direction: column;
  gap: 0.45rem;
  padding: 0.45rem 0.6rem 0.4rem;
  background:
    linear-gradient(180deg, rgba(12, 9, 7, 0.72), rgba(12, 9, 7, 0.88)),
    url("/stitch-assets/login-hero.png") center 30% / cover no-repeat;
  color: #eae1db;
}
.char-desk-grid {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 16.5rem minmax(0, 1fr) 18.5rem;
  gap: 0.5rem;
}
.char-col, .char-stage, .char-bag, .char-deck {
  background: rgba(18, 14, 12, 0.92);
  border: 1px solid rgba(253, 186, 69, 0.28);
  border-radius: 0.75rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}
.char-col, .char-bag { padding: 0.65rem 0.7rem; min-height: 0; overflow: auto; }
.char-kicker { margin: 0; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #fdba45; }
.char-name-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.char-name-row h2 { margin: 0.15rem 0 0; font-size: 1.15rem; color: #fff3d4; }
.char-name-row span, .char-role { color: #d5c4af; font-size: 12px; }
.char-power { display: flex; align-items: baseline; gap: 0.4rem; margin: 0.35rem 0; }
.char-power strong { font-size: 1.7rem; color: #fdba45; line-height: 1; }
.char-power span, .char-block-title { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #fcd38a; }
.char-stats { list-style: none; margin: 0.25rem 0 0.5rem; padding: 0; display: flex; flex-direction: column; gap: 0.28rem; }
.char-stats li { display: grid; grid-template-columns: 1fr auto auto; gap: 0.45rem; font-size: 12px; }
.char-stats b { color: #fff3d4; }
.char-stats em { color: #89d98c; font-style: normal; min-width: 2rem; }
.char-note { margin: 0.2rem 0 0; font-size: 12px; color: #d5c4af; }
.char-stage { display: flex; flex-direction: column; min-height: 0; padding: 0.45rem; }
.char-stage-frame { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 7.2rem minmax(0, 1fr) 7.2rem; gap: 0.4rem; }
.char-slots { display: flex; flex-direction: column; justify-content: space-between; gap: 0.4rem; }
.char-slot {
  flex: 0 0 auto;
  min-height: 4.1rem;
  border-radius: 0.6rem;
  border: 1px solid rgba(253, 186, 69, 0.45);
  background: rgba(0, 0, 0, 0.45);
  color: #eae1db;
  text-align: left;
  padding: 0.35rem 0.45rem;
  cursor: pointer;
}
.char-slot small { display: block; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: #fcd38a; }
.char-slot strong { display: block; font-size: 12px; font-weight: 700; }
.char-slot.is-filled { box-shadow: inset 0 0 0 1px rgba(137, 217, 140, 0.45); }
.char-portrait { position: relative; border-radius: 0.7rem; overflow: hidden; min-height: 0; }
.char-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.char-portrait p {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0;
  padding: 0.35rem 0.5rem; background: linear-gradient(transparent, rgba(0,0,0,0.8));
  font-size: 13px; font-weight: 700;
}
.char-stage-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding-top: 0.35rem; }
.char-stage-foot p { margin: 0; font-size: 12px; color: #d5c4af; }
.char-btn, .char-bag-tabs button, .char-bag-item, .char-deck-card {
  font-family: Rubik, sans-serif; cursor: pointer;
}
.char-btn {
  border: 0; border-radius: 0.55rem; padding: 0.4rem 0.75rem;
  background: #fdba45; color: #2a1c00; font-weight: 800; font-size: 12px;
}
.char-btn-ghost { background: transparent; color: #fdba45; border: 1px solid rgba(253, 186, 69, 0.5); }
.char-bag { display: flex; flex-direction: column; gap: 0.4rem; }
.char-bag-head { display: flex; justify-content: space-between; align-items: baseline; }
.char-bag-head strong { letter-spacing: 0.12em; text-transform: uppercase; color: #fdba45; font-size: 13px; }
.char-bag-head span, .char-bag-tabs button { font-size: 11px; color: #d5c4af; }
.char-bag-tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.char-bag-tabs button { border: 0; background: rgba(255,255,255,0.04); border-radius: 999px; padding: 0.2rem 0.5rem; }
.char-bag-tabs button.is-on { background: #fdba45; color: #2a1c00; font-weight: 800; }
.char-bag-grid { flex: 1 1 auto; min-height: 0; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; align-content: start; }
.char-bag-item {
  text-align: left; border-radius: 0.5rem; border: 1px solid rgba(253, 186, 69, 0.25);
  background: rgba(0,0,0,0.35); color: #eae1db; padding: 0.35rem 0.4rem;
}
.char-bag-item strong, .char-bag-item small { display: block; }
.char-bag-item small { color: #d5c4af; font-size: 10px; }
.char-bag-item.is-worn { border-color: #89d98c; }
.char-bag-item.is-focus { box-shadow: inset 0 0 0 1px #fdba45; }
.char-compare { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; border-top: 1px solid rgba(253, 186, 69, 0.2); padding-top: 0.35rem; }
.char-compare strong { display: block; font-size: 13px; }
.char-compare p { margin: 0.1rem 0 0; font-size: 11px; color: #d5c4af; }
.char-deck { display: flex; align-items: center; gap: 0.75rem; padding: 0.4rem 0.6rem; }
.char-deck-row { display: flex; gap: 0.4rem; flex: 1 1 auto; min-width: 0; overflow: auto; }
.char-deck-card {
  flex: 1 1 4.6rem; min-width: 4.6rem; text-align: left; border-radius: 0.55rem;
  border: 1px solid rgba(253, 186, 69, 0.3); background: rgba(0,0,0,0.4); color: #eae1db; padding: 0.3rem 0.45rem;
}
.char-deck-card small, .char-deck-card span { display: block; font-size: 10px; color: #d5c4af; }
.char-deck-card strong { font-size: 12px; }
.char-deck-card.is-active { border-color: #fdba45; box-shadow: 0 0 0 1px rgba(253, 186, 69, 0.35); }
body:has(#viewHome:not(.hidden)) #wireDock { display: none !important; }
</style>
</head>
<body>
<section id="viewHome" class="stitch-view mythfel-form hidden" data-stitch="home" data-layout="landscape">
<main class="char-desk" data-purpose="character-home">
<div class="char-desk-grid">
<aside class="char-col" id="homeStatBlock" aria-label="Параметры персонажа"></aside>
<section class="char-stage" aria-label="Очаг">
<div class="char-stage-frame" id="homeHeroCard"></div>
<div class="char-stage-foot">
<p id="homeSetLine">Слоты пусты.</p>
<button type="button" class="char-btn char-btn-ghost" id="homeUnequip">Снять</button>
</div>
</section>
<aside class="char-bag" aria-label="Инвентарь">
<div class="char-bag-head">
<strong>Инвентарь</strong>
<span>Экипировка</span>
</div>
<div class="char-bag-tabs" id="homeBagTabs">
<button type="button" data-bag="all" class="is-on">Всё</button>
<button type="button" data-bag="weapon">Оружие</button>
<button type="button" data-bag="armor">Броня</button>
<button type="button" data-bag="helm">Шлем</button>
<button type="button" data-bag="boots">Обувь</button>
</div>
<div class="char-bag-grid" id="homeGearBlock"></div>
<div class="char-compare" id="homeCompare"></div>
</aside>
</div>
<footer class="char-deck">
<div>
<p class="char-kicker">Дом Хранителя · Персонаж</p>
<p id="homeDeckLabel">Боевая колода</p>
</div>
<div class="char-deck-row" id="homeCatPicker"></div>
</footer>
</main>
</section>
</body>
</html>
